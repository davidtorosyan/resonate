<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1e" />
    <title>Resonate · Sing</title>
    <style>
      :root { color-scheme: dark; }
      /* An open menu's list takes the option's own colours (Chrome on Windows drew the see-through
         select background as white under the light text). */
      option, optgroup { background: #1a1a30; color: #e8e8f0; }
      option:disabled { color: #8a8aa0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%);
        color: #e8e8f0;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
      }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace; }
      header {
        padding: 0.9rem 1.25rem 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
      }
      .header-left { display: flex; align-items: baseline; gap: 0.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0.25rem 0 0; font-weight: 600; letter-spacing: 0.02em; opacity: 0.95; }
      .nav-link {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        padding: 0.2rem 0.6rem;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
      }
      .header-right { display: flex; align-items: baseline; gap: 0.6rem; }
      /* 📡 Remote: off = a quiet icon; on = clearly lit (an assistant can act on this page). */
      /* (above the sheets and overlays: the switch can always be reached) */
      .remote-btn { position: relative; z-index: 60; font: inherit; font-size: 0.75rem; color: #e8e8f0; background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 0.15rem 0.5rem; cursor: pointer; opacity: 0.65; touch-action: manipulation; }
      .remote-btn[data-on="true"] { opacity: 1; background: #a64fff; border-color: #c48bff; box-shadow: 0 0 0 0.2rem rgba(166,79,255,0.25); font-weight: 600; animation: remote-pulse 2.4s ease-in-out infinite; }
      @keyframes remote-pulse { 50% { box-shadow: 0 0 0 0.35rem rgba(166,79,255,0.08); } }
      @media (prefers-reduced-motion: reduce) { .remote-btn[data-on="true"] { animation: none; } }
      #version { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; color: #a64fff; opacity: 0.9; }
      #status { font-size: 0.75rem; opacity: 0.55; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 0.25rem 1rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        min-height: 0;
      }
      .controls { display: flex; gap: 0.4rem; flex-shrink: 0; }
      .controls select {
        font: inherit;
        font-size: 0.8rem;
        color: #e8e8f0;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 0.5rem;
        padding: 0.35rem 0.3rem;
        min-width: 0;
        flex: 1 1 0;
      }
      .controls select[hidden] { display: none; }
      .controls select:disabled { opacity: 0.4; }
      #song-select { flex: 2 1 0; }
      .tool-btn {
        font: inherit;
        font-size: 0.78rem;
        color: #e8e8f0;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 0.5rem;
        padding: 0.35rem 0.55rem;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .tool-btn[hidden] { display: none; }
      .tool-btn:disabled { opacity: 0.4; }
      #song-msg { font-size: 0.8rem; color: rgba(255,255,255,0.7); line-height: 1.35; }
      #song-msg[data-kind="error"] { color: #ff8a9a; }
      #song-msg[data-kind="ok"] { color: #4ade80; }
      #song-msg[hidden] { display: none; }
      #song-msg a { color: #9ec1ff; }
      #drop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15,15,30,0.85);
        border: 3px dashed rgba(166,79,255,0.7);
        font-size: 1.2rem;
        font-weight: 600;
        pointer-events: none;
      }
      #drop[hidden] { display: none; }

      #lyrics { flex-shrink: 0; min-height: 3.6rem; text-align: center; position: relative; }
      #loop-btn[hidden] { display: none; }
      #loopbar { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.55rem 0.75rem; border-radius: 0.8rem; border: 1px solid rgba(255,214,120,0.4); background: rgba(255,214,120,0.07); }
      #loopbar[hidden] { display: none; }
      #lp-text { font-weight: 700; font-size: 0.98rem; }
      #lp-text[data-tune="good"] { color: #4ade80; }
      #lyric-now { font-size: 1.35rem; font-weight: 700; line-height: 1.35; min-height: 1.35em; }
      #lyric-next { font-size: 0.9rem; opacity: 0.45; min-height: 1.35em; margin-top: 0.15rem; }
      .syl { transition: color 0.1s ease; color: rgba(255,255,255,0.75); }
      .syl[data-state="current"] { color: #ffe6a0; text-shadow: 0 0 12px rgba(255,230,160,0.5); }
      .syl[data-state="good"] { color: #4ade80; }
      .syl[data-state="ok"] { color: #c49bff; }
      .syl[data-state="off"] { color: #f5a85a; }
      .syl[data-state="missed"] { color: rgba(255,255,255,0.35); }
      .syl[data-state="unclear"] { color: rgba(170,180,255,0.7); }

      #lane {
        width: 100%;
        flex: 1 1 auto;
        min-height: 170px;
        border-radius: 1rem;
        background: rgba(255,255,255,0.02);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        touch-action: pan-y;
      }
      #lane[data-pannable="true"] { cursor: grab; touch-action: none; }

      #results { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 0.4rem; }
      .results-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.6rem; }
      #score-pct { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; min-width: 3.2ch; }
      #score-pct:empty { display: none; }
      #summary { font-size: 0.68rem; letter-spacing: 0.08em; color: rgba(255,255,255,0.55); flex: 1 1 9rem; min-width: 0; }
      .live { display: inline-flex; align-items: center; gap: 0.6rem; margin-left: auto; } /* wraps to its own line when the row is narrow */
      /* The note you're singing (Pitch on, or during a take), against the practice target. */
      #you { display: inline-flex; align-items: center; gap: 0.4rem; flex: 0 0 auto; }
      #you[hidden] { display: none; }
      #you-note { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; min-width: 2.4ch; text-align: right; }
      #you[data-state="good"] #you-note { color: #4ade80; }
      #you[data-state="ok"] #you-note { color: #c49bff; }
      #you[data-state="off"] #you-note { color: #f5a85a; }
      #you[data-state="hear"] #you-note { color: #ffe6a0; }
      #you[data-state="wait"] #you-note { opacity: 0.35; }
      .you-detail { display: flex; flex-direction: column; font-size: 0.68rem; line-height: 1.3; color: rgba(255,255,255,0.7); min-width: 4.6rem; }
      #you[data-state="good"] #you-vs { color: #4ade80; }
      #you[data-state="ok"] #you-vs { color: #c49bff; }
      #you[data-state="off"] #you-vs { color: #f5b066; }
      #monitor[aria-pressed="true"] { background: rgba(74,222,128,0.16); border-color: rgba(74,222,128,0.6); }
      #playbar { display: flex; align-items: center; gap: 0.5rem; }
      #playbar[hidden] { display: none; }
      #play {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        border: 0;
        color: #0f0f1e;
        background: rgb(120,200,255);
        cursor: pointer;
        min-width: 5.5rem;
      }
      #play[data-playing="true"] { background: #fff; }

      /* Review after a take (coach.js): the lines to work on, then every line. */
      .overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(8,8,20,0.45); }
      .overlay[hidden] { display: none; }
      .overlay .sheet {
        width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
        background: linear-gradient(180deg, #1d1d40, #14142c); border: 1px solid rgba(255,255,255,0.1); border-bottom: 0;
        border-radius: 1.1rem 1.1rem 0 0; padding: 0.9rem 1rem calc(1rem + env(safe-area-inset-bottom));
        box-shadow: 0 -12px 40px rgba(0,0,0,0.45);
      }
      .rv-head { display: flex; align-items: center; gap: 0.7rem; position: sticky; top: -0.9rem; margin: -0.9rem -1rem 0.2rem; padding: 0.9rem 1rem 0.5rem; background: #1d1d40; z-index: 1; }
      #rv-headline { flex: 1; min-width: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
      #rv-wins { list-style: none; margin: 0.2rem 0 0; padding: 0; font-size: 0.88rem; line-height: 1.4; }
      #rv-wins:empty { display: none; }
      #rv-wins li::before { content: "✓ "; color: #4ade80; font-weight: 700; }
      #rv-wins li[data-li] { cursor: pointer; }
      #rv-tip { margin: 0.6rem 0 0; font-size: 0.88rem; line-height: 1.4; color: #ffe6a0; }
      .overlay h3 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin: 0.9rem 0 0.45rem; font-weight: 600; }
      .rv-line { border: 1px solid rgba(255,255,255,0.1); border-radius: 0.8rem; padding: 0.55rem 0.65rem; margin-bottom: 0.45rem; background: rgba(255,255,255,0.03); }
      .rv-line.work { border-color: rgba(255,214,120,0.35); background: rgba(255,214,120,0.05); }
      .rv-line[data-playing="true"] { border-color: #ffe6a0; }
      .rv-top { display: flex; align-items: baseline; gap: 0.55rem; }
      .rv-mark { font-weight: 700; font-size: 0.95rem; min-width: 1.1rem; color: #4ade80; }
      .rv-text { flex: 1; min-width: 0; font-size: 0.92rem; line-height: 1.3; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; }
      .rv-d { font-size: 0.72rem; font-weight: 600; white-space: nowrap; color: #4ade80; }
      .rv-why { margin: 0.3rem 0 0 1.65rem; padding: 0; list-style: none; font-size: 0.78rem; line-height: 1.35; color: rgba(255,255,255,0.75); }
      .rv-why li::before { content: "· "; color: rgba(255,214,120,0.8); }
      .rv-btns { display: flex; gap: 0.35rem; margin: 0.45rem 0 0 1.65rem; flex-wrap: wrap; }
      .rv-btns button { font: inherit; font-size: 0.76rem; color: #e8e8f0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 0.3rem 0.65rem; cursor: pointer; }
      .rv-btns button[data-on="true"] { background: #ffe6a0; color: #14142c; border-color: #ffe6a0; }
      .rv-btns button:disabled { opacity: 0.35; }
      .rv-empty { font-size: 0.86rem; color: rgba(255,255,255,0.7); line-height: 1.4; }
      .op-title { flex: 1; font-weight: 700; font-size: 1.05rem; }
      .op-choice { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.55rem 0.65rem; margin-bottom: 0.4rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 0.8rem; font-size: 0.86rem; line-height: 1.35; color: rgba(255,255,255,0.85); cursor: pointer; }
      .op-choice:has(input:checked) { border-color: rgba(166,79,255,0.7); background: rgba(166,79,255,0.1); }
      .op-choice input { margin-top: 0.2rem; accent-color: #a64fff; }
      #options select { width: 100%; font: inherit; font-size: 0.9rem; color: #e8e8f0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); border-radius: 0.6rem; padding: 0.5rem; }

      /* Tapping: the tempo, or the timing of a recording. */
      .pad { display: block; width: 100%; margin: 0.8rem 0 0.5rem; padding: 1.6rem 0; font: inherit; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.06em;
        color: #14142c; background: linear-gradient(135deg, #ffe6a0, #ffc46b); border: 0; border-radius: 1rem; cursor: pointer;
        touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .pad:active { transform: scale(0.985); filter: brightness(1.08); }
      .pad-read { text-align: center; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.6rem; }
      .go { font: inherit; font-weight: 700; font-size: 0.9rem; color: white; border: 0; border-radius: 999px; padding: 0.55rem 1.1rem; background: linear-gradient(135deg, #4f7cff, #a64fff); cursor: pointer; }
      .go:disabled { opacity: 0.4; cursor: default; }
      #tt-use { display: block; margin: 0 auto; }
      .ta-row { display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; margin-top: 0.55rem; }
      .ta-start { flex: 1; text-align: center; font-size: 0.82rem; color: rgba(255,255,255,0.75); }
      #ta-lyrics { margin-top: 0.7rem; text-align: center; min-height: 3.4rem; }
      #ta-now { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
      #ta-next { font-size: 0.85rem; opacity: 0.45; margin-top: 0.15rem; }
      #ta-now span[data-s="done"] { color: rgba(255,255,255,0.4); }
      #ta-now span[data-s="next"] { color: #ffe6a0; text-decoration: underline; text-underline-offset: 4px; }
      #ta-count { font-size: 0.75rem; color: rgba(255,255,255,0.6); }

      /* Perform: a take shows just the lyrics (the lane, chips and readout come back after). */
      #lyric-prev { font-size: 0.95rem; min-height: 0; transition: color 0.3s ease; }
      #lyric-prev:empty { display: none; }
      #lyric-prev { color: rgba(255,255,255,0.45); }
      #lyric-prev[data-tune="good"] { color: rgba(74,222,128,0.85); }
      #lyric-prev .syl { color: inherit; }
      #lyric-prev .pct { font-size: 0.75em; margin-left: 0.4em; font-weight: 700; }
      #countin { font-size: 3.4rem; font-weight: 800; color: #ffe6a0; line-height: 1.1; }
      #countin[hidden] { display: none; }
      body[data-perform="true"] #lane, body[data-perform="true"] #results { display: none; }
      body[data-perform="true"] #lyrics { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.9rem; }
      body[data-perform="true"] #lyric-prev { font-size: 1.15rem; }
      body[data-perform="true"] #lyric-now { font-size: 2.05rem; line-height: 1.3; }
      body[data-perform="true"] #lyric-next { font-size: 1.2rem; }
      .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; }
      .seg button {
        font: inherit;
        font-size: 0.75rem;
        padding: 0.35rem 0.6rem;
        border: 0;
        background: transparent;
        color: rgba(255,255,255,0.65);
        cursor: pointer;
      }
      .seg button:disabled { opacity: 0.3; cursor: default; }
      .seg button[data-active="true"] { background: rgba(120,200,255,0.3); color: #fff; }

      #chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        max-height: 18vh;
        min-height: 2.6rem; /* shrinks (it scrolls) rather than run under the footer on a short screen */
        flex: 0 1 auto;
        overflow-y: auto;
        align-content: flex-start;
      }
      .chip {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding: 0.2rem 0.35rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: inherit;
        font: inherit;
        cursor: pointer;
        min-width: 2.7rem;
        touch-action: pan-y pinch-zoom; /* a held finger is a held key; a vertical drag scrolls */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no copy / look-up callout on a long press */
      }
      .chip i { font-style: italic; font-weight: 600; font-size: 0.8rem; color: #ffe6a0; white-space: nowrap; min-height: 1.1em; }
      .chip i.held { align-self: stretch; display: flex; align-items: flex-end; } /* the word goes on: an extender line */
      .chip i.held::before { content: ""; flex: 1; height: 2px; margin: 0 -0.2rem 0.2em; background: rgba(255,230,160,0.45); border-radius: 1px; }
      .chip b { font-size: 0.72rem; opacity: 0.85; }
      .chip small { font-size: 0.6rem; opacity: 0.65; font-variant-numeric: tabular-nums; min-height: 1.1em; }
      .chip[data-tune="good"] { border-color: rgba(74,222,128,0.5); }
      .chip[data-tune="ok"] { border-color: rgba(166,79,255,0.55); }
      .chip[data-tune="off"] { border-color: rgba(245,170,90,0.6); }
      .chip[data-tune="missed"] { border-style: dashed; border-color: rgba(255,255,255,0.35); opacity: 0.75; }
      .chip[data-tune="unsung"] { opacity: 0.45; }
      .chip[data-tune="unclear"] { border-style: dotted; border-color: rgba(170,180,255,0.6); }
      .chip[data-current="true"] { background: rgba(255,230,160,0.15); }
      .chip[data-playing="true"] { background: rgba(255,230,160,0.32); border-color: #ffe6a0; }
      .phrase-break { flex-basis: 100%; height: 0; }

      footer {
        padding: 0.8rem 1.25rem calc(1.1rem + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        gap: 0.75rem;
      }
      footer button {
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 0.95rem 1.6rem;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      footer button:active { transform: scale(0.97); }
      footer button:disabled { opacity: 0.5; cursor: not-allowed; }
      #listen { background: transparent; border: 1px solid rgba(255,255,255,0.25); min-width: 120px; }
      #sing {
        background: linear-gradient(135deg, #4f7cff, #a64fff);
        box-shadow: 0 8px 24px -8px rgba(79,124,255,0.5);
        min-width: 160px;
      }
      #sing[data-active="true"] {
        background: linear-gradient(135deg, #ff4f6f, #ff8a4f);
        box-shadow: 0 8px 24px -8px rgba(255,79,111,0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Sing</h1>
        <a class="nav-link" href="./">Tuner</a>
        <a class="nav-link" href="record.html">Record</a>
        <a class="nav-link" href="tools.html">Tools</a>
      </div>
      <div class="header-right mono">
        <button id="remote-btn" class="remote-btn" type="button" hidden aria-pressed="false">📡</button>
        <span id="version">v73</span>
        <span id="status"></span>
      </div>
    </header>
    <main>
      <section class="controls">
        <select id="song-select" aria-label="Song">
          <optgroup label="Samples">
            <option value="amazing-grace">Amazing Grace</option>
          </optgroup>
          <optgroup id="my-songs" label="My songs" hidden></optgroup>
        </select>
        <button id="open-file" class="tool-btn" type="button" title="MusicXML (.musicxml, .xml, .mxl)">Open</button>
        <button id="open-link" class="tool-btn" type="button" title="MusicXML link">Link</button>
        <button id="save-song" class="tool-btn" type="button" title="Download MusicXML" aria-label="Download MusicXML">⤓</button>
        <button id="remove-song" class="tool-btn" type="button" title="Remove from My songs" hidden>✕</button>
        <!-- No accept filter: iOS greys out .musicxml/.mxl (no system file type for them). Files are validated after picking. -->
        <input id="file-input" type="file" hidden />
      </section>
      <section class="controls">
        <select id="verse-select" aria-label="Verse" hidden></select>
        <select id="key-select" aria-label="Transpose" title="Transpose"></select>
        <select id="tempo-select" aria-label="Tempo"></select>
        <button id="options-btn" class="tool-btn" type="button" title="Singing options" aria-label="Singing options">⚙</button>
      </section>
      <div id="song-msg" hidden></div>
      <section id="lyrics">
        <div id="countin" class="mono" hidden></div>
        <div id="lyric-prev"></div>
        <div id="lyric-now"></div>
        <div id="lyric-next"></div>
      </section>
      <canvas id="lane"></canvas>
      <section id="results">
        <div id="loopbar" hidden>
          <span id="lp-text"></span>
        </div>
        <div class="results-head">
          <span id="score-pct"></span>
          <span id="summary" class="mono"></span>
          <span class="live">
            <span id="you" hidden>
              <b id="you-note"></b>
              <span class="you-detail mono"><span id="you-cents"></span><span id="you-vs"></span></span>
            </span>
            <button id="loop-btn" class="tool-btn" type="button" title="Hear it, sing it, repeat" hidden>⟳ Loop line</button>
            <button id="monitor" class="tool-btn" type="button" aria-pressed="false" title="Your pitch (mic)">🎤 Pitch</button>
          </span>
        </div>
        <div id="playbar" hidden>
          <button id="play" type="button">▶ Play</button>
          <button id="review-btn" class="tool-btn" type="button">Review</button>
          <span id="play-modes" class="seg" role="group" aria-label="Playback">
            <button type="button" data-mode="voice" title="Your recording">Voice</button>
            <button type="button" data-mode="melody" title="The song's melody on piano">Melody</button>
            <button type="button" data-mode="both" title="Your recording + the melody">Both</button>
          </span>
        </div>
        <div id="chips"></div>
      </section>
    </main>
    <footer>
      <button id="listen" type="button">▶ Listen</button>
      <button id="sing" type="button">● Sing</button>
    </footer>
    <div id="drop" hidden>Drop MusicXML here</div>
    <div id="options" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-labelledby="op-title">
        <div class="rv-head">
          <span id="op-title" class="op-title">Singing options</span>
          <button id="op-close" class="tool-btn" type="button" aria-label="Close the options">✕</button>
        </div>
        <h3>While you sing</h3>
        <label class="op-choice"><input type="radio" name="view" value="practice" /><span><b>Practice</b> — notes + your pitch</span></label>
        <label class="op-choice"><input type="radio" name="view" value="perform" /><span><b>Perform</b> — lyrics only, review after</span></label>
        <h3>Guide</h3>
        <select id="guide-select" aria-label="Guide while singing">
          <option value="click">Click</option>
          <option value="melody">Melody (headphones)</option>
          <option value="none">None</option>
        </select>
      </div>
    </div>
    <div id="taptempo" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-labelledby="tt-title">
        <div class="rv-head">
          <span id="tt-title" class="op-title">Tap the beat</span>
          <button id="tt-close" class="tool-btn" type="button" aria-label="Close">✕</button>
        </div>
        <button id="tt-pad" class="pad" type="button">Tap</button>
        <div id="tt-bpm" class="pad-read mono">—</div>
        <button id="tt-use" class="go" type="button" disabled>Use this tempo</button>
      </div>
    </div>
    <div id="tapalong" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-labelledby="ta-title">
        <div class="rv-head">
          <span id="ta-title" class="op-title">Tap along with a recording</span>
          <button id="ta-close" class="tool-btn" type="button" aria-label="Close">✕</button>
        </div>
        <p class="rv-empty">Play the recording in another app; tap as it's sung.</p>
        <div class="ta-row">
          <span class="seg" id="ta-mode" role="group" aria-label="What to tap">
            <button type="button" data-mode="words">Every syllable</button>
            <button type="button" data-mode="lines">Each line's start</button>
          </span>
        </div>
        <div class="ta-row">
          <button id="ta-prevline" class="tool-btn" type="button" aria-label="Start a line earlier">◀</button>
          <span id="ta-start" class="ta-start"></span>
          <button id="ta-nextline" class="tool-btn" type="button" aria-label="Start a line later">▶</button>
        </div>
        <div id="ta-lyrics">
          <div id="ta-now"></div>
          <div id="ta-next"></div>
        </div>
        <button id="ta-pad" class="pad" type="button">Tap</button>
        <div class="ta-row">
          <button id="ta-undo" class="tool-btn" type="button">↶ Undo</button>
          <span id="ta-count" class="mono"></span>
          <button id="ta-save" class="go" type="button" disabled>Save timing</button>
        </div>
      </div>
    </div>
    <div id="review" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-labelledby="rv-title">
        <div class="rv-head">
          <span id="rv-headline"></span>
          <button id="rv-save" class="tool-btn" type="button" title="Save this take (audio + timing data)" aria-label="Save this take">⤓</button>
          <button id="rv-close" class="tool-btn" type="button" aria-label="Close the review">✕</button>
        </div>
        <ul id="rv-wins"></ul>
        <p id="rv-tip" hidden></p>
        <h3 id="rv-title">Try next</h3>
        <div id="rv-work"></div>
        <h3>Every line</h3>
        <div id="rv-lines"></div>
      </div>
    </div>
    <script type="module" src="nav.js?v=73"></script>
    <script type="module" src="sing.js?v=73"></script>
  </body>
</html>
