<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f0f1e" />
    <title>Resonate · Harp</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%) fixed;
        color: #e8e8f0;
        display: flex; flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; padding: 0.55rem 0.8rem 0.4rem; }
      h1 { font-size: 1.1rem; margin: 0 0.15rem 0 0; font-weight: 600; letter-spacing: 0.02em; }
      .nav-link { font-size: 0.8rem; color: rgba(255,255,255,0.6); text-decoration: none; padding: 0.2rem 0.6rem; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; }
      .spacer { flex: 1; }
      #version { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; color: #a64fff; opacity: 0.9; }
      button, select {
        font: inherit; font-size: 0.85rem; color: #e8e8f0; background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.16); border-radius: 0.6rem; min-height: 40px; padding: 0 0.7rem;
      }
      button[aria-pressed="true"] { background: rgba(166,79,255,0.28); border-color: rgba(166,79,255,0.7); }
      #stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #beats { position: absolute; left: 0.8rem; bottom: 0.5rem; font-size: 0.78rem; opacity: 0.7; pointer-events: none; }
      canvas { transition: filter 0.8s ease; }
      #stage[data-locked] canvas { filter: grayscale(1) brightness(0.45); }
      #lock { position: absolute; inset: 0; background: rgba(10,10,24,0.35); opacity: 1; transition: opacity 0.45s ease; }
      #lock[hidden] { display: none; }
      #lock.out { opacity: 0; pointer-events: none; }
      #go {
        position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom) * 0); transform: translateX(-50%); z-index: 2;
        height: 56px; min-width: 56px; padding: 0 1.6rem; border-radius: 999px; font-size: 1.1rem; font-weight: 600;
        transition: background 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease;
      }
      #go[data-mode="start"] { border: none; background: #7a3fe0; color: #fff; box-shadow: 0 10px 34px rgba(0,0,0,0.55), 0 0 0 6px rgba(122,63,224,0.18); }
      #go[data-mode="stop"] { padding: 0; width: 56px; font-size: 1.3rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); }
      #footR { position: absolute; bottom: 14px; left: calc(50% + 44px); height: 56px; z-index: 2; display: flex; align-items: center; gap: 8px; }
      #go[data-mode="start"] ~ #footR { left: calc(50% + 86px); }
      #add, #step, #dbl { height: 48px; border-radius: 999px; padding: 0 1rem; white-space: nowrap; }
      #dbl:disabled { opacity: 0.35; }
      #step:disabled { opacity: 0.35; }
      #step .narrow { display: none; }
      #ff { position: absolute; bottom: 14px; right: calc(50% + 44px); z-index: 2; height: 48px; margin-bottom: 4px; border-radius: 999px; padding: 0 0.9rem; display: flex; align-items: center; gap: 0.4rem; }
      #go[data-mode="start"] ~ #ff { right: calc(50% + 86px); }
      #ff[hidden] { display: none; }
      #ff span { font-size: 0.85rem; }
      #ff:disabled { opacity: 0.35; }
      #stage[data-demo] #ff { background: rgba(166,79,255,0.28); border-color: rgba(166,79,255,0.7); }
      @media (max-width: 560px) { #ff span { display: none; } }
      #temper { position: absolute; bottom: 18px; right: calc(50% + 44px); z-index: 2; display: flex; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; overflow: hidden; }
      #temper[hidden] { display: none; }
      #temper button { border: none; border-radius: 0; min-height: 44px; background: rgba(255,255,255,0.05); padding: 0 0.85rem; font-size: 0.85rem; }
      #temper button + button { border-left: 1px solid rgba(255,255,255,0.14); }
      #temper button[aria-pressed="true"] { background: rgba(166,79,255,0.4); }
      #chords { display: flex; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; overflow: hidden; }
      #chords[hidden] { display: none; }
      #chords button { border: none; border-radius: 0; min-height: 44px; min-width: 52px; background: rgba(255,255,255,0.05); padding: 0 0.75rem; font-size: 0.85rem; }
      #chords button + button { border-left: 1px solid rgba(255,255,255,0.14); }
      #chords button:active { background: rgba(166,79,255,0.4); }
      @media (max-width: 560px) {
        #temper { right: auto; left: calc(50% - 170px); bottom: 82px; }
        #temper button { padding: 0 0.6rem; }
        #footR { left: calc(50% + 36px); gap: 4px; }
        #add, #step, #dbl { padding: 0 0.45rem; font-size: 0.78rem; }
        #go[data-mode="start"] ~ #footR #dbl { display: none; }
        #step .wide { display: none; } #step .narrow { display: inline; }
        #chords { position: absolute; left: 134px; transform: translateX(-100%); bottom: 68px; }
        #go[data-mode="start"] ~ #footR { left: calc(50% + 63px); }
        #go[data-mode="start"] ~ #ff { right: calc(50% + 63px); }
        #go[data-mode="start"] ~ #footR #chords { left: 107px; }
        #chords button { min-width: 44px; padding: 0 0.55rem; }
      }
      #go:active { transform: translateX(-50%) scale(0.94); }
      #remove { position: absolute; display: none; transform: translate(-50%, -50%); background: #3a1530; border-color: #ff7aa8; color: #ffc2d6; }
    </style>
  </head>
  <body>
    <header>
      <h1>Harp</h1>
      <a class="nav-link" href="tools.html">Tools</a>
      <span class="spacer"></span>
      <select id="note" aria-label="Open string note"></select>
      <select id="preset" aria-label="Preset">
        <option value="">Preset…</option>
        <option value="reset">Reset · 1 string</option>
        <option value="penta">Pentatonic</option>
        <option value="pyth">12 by fifths</option>
      </select>
      <select id="snap" aria-label="Snapping">
        <option value="strong">Snap: strong</option>
        <option value="gentle">Snap: gentle</option>
        <option value="off">Snap: off</option>
      </select>
      <button id="notes" aria-pressed="false" aria-label="Find the notes">♪ Notes</button>
      <button id="zoom" aria-pressed="false" aria-label="Zoom in on the bridges" title="Zoom in on the bridges" hidden>🔍</button>
      <button id="info" aria-pressed="false" aria-label="Show the numbers" class="mono">123</button>
      <span id="version" class="mono">v126</span>
    </header>
    <div id="stage" data-locked="1">
      <canvas id="cv"></canvas>
      <div id="beats" class="mono"></div>
      <button id="remove">✕ remove</button>
      <div id="lock" hidden></div>
      <button id="go" data-mode="start" aria-label="Start the harp">▶ Start</button>

      <button id="ff" aria-label="Show the steps to the next tuning">⏩<span></span></button>
      <div id="temper" role="group" aria-label="Tuning" hidden>
        <button data-t="pyth" title="12 by fifths (Pythagorean)">Fifths</button><button data-t="mean" title="Meantone (quarter-comma)">Meantone</button><button data-t="et" title="Equal temperament">Equal</button>
      </div>
      <div id="footR">
        <button id="add" aria-label="Add a string">+ string</button>
        <button id="dbl" aria-label="Add a string an octave below the last" title="An octave below the last string (twice its length)">×2</button>
        <button id="step" aria-label="Add the next fifth" title="Add the next fifth"><span class="wide">+ fifth</span><span class="narrow">+5th</span></button>
        <div id="chords" role="group" aria-label="Chords" hidden>
          <button data-c="F♯3 A♯3 C♯4" aria-label="Play F♯ major" title="F♯3 · A♯3 · C♯4">▶ F♯</button><button data-c="B3 D♯4 F♯4" aria-label="Play B major" title="B3 · D♯4 · F♯4">▶ B</button>
        </div>
      </div>
    </div>
    <script type="module" src="harp.js?v=126"></script>
  </body>
</html>
