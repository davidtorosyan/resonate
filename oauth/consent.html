<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1e" />
    <meta name="referrer" content="no-referrer" />
    <title>Resonate · Connect an assistant</title>
    <style>
      :root { color-scheme: dark; }
      /* Shown only once this page knows it isn't framed (frame-busting: GitHub Pages can't send frame-ancestors). */
      html { display: none; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%) fixed;
        color: #e8e8f0;
        padding-top: env(safe-area-inset-top);
      }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace; }
      header { padding: 0.9rem 1.25rem 0.5rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
      h1 { font-size: 1.25rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; opacity: 0.95; }
      #version { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; color: #a64fff; opacity: 0.9; }
      main { max-width: 420px; margin: 0 auto; padding: 0.75rem 1rem calc(2rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 0.9rem; }
      .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .card[hidden] { display: none; }
      h2 { margin: 0; font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
      label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; opacity: 0.85; }
      input { font: inherit; font-size: 1rem; color: #fff; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.18); border-radius: 0.6rem; padding: 0.65rem 0.75rem; }
      input:focus { outline: none; border-color: #a64fff; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      button { font: inherit; font-size: 0.95rem; font-weight: 600; border-radius: 0.7rem; padding: 0.65rem 1rem; border: 1px solid rgba(255,255,255,0.22); background: none; color: #e8e8f0; cursor: pointer; }
      button.primary { background: #a64fff; border-color: #a64fff; color: #fff; }
      button:disabled { opacity: 0.5; }
      ul { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; line-height: 1.5; }
      .who, .to { font-size: 0.85rem; opacity: 0.7; overflow-wrap: anywhere; }
      #msg { min-height: 1.3em; font-size: 0.88rem; text-align: center; }
      #msg[data-kind="error"] { color: #ffb38a; }
      #msg[data-kind="ok"] { color: #8ee6a8; }
    </style>
    <script>
      // Never framed: another site could otherwise trick a tap onto Allow.
      if (window.top !== window.self) { try { window.top.location = window.self.location; } catch { document.write(""); } }
      else document.documentElement.style.display = "block";
    </script>
  </head>
  <body>
    <header>
      <h1>Resonate</h1>
      <span id="version" class="mono">v74</span>
    </header>
    <main>
      <form id="v-signin" class="card" hidden>
        <h2>Sign in to connect</h2>
        <label>Email <input id="email" type="email" autocomplete="username" inputmode="email" required /></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <div class="row"><button class="primary" type="submit">Sign in</button></div>
      </form>

      <section id="v-ask" class="card" hidden>
        <h2 id="client"></h2>
        <div>wants to use your Resonate account:</div>
        <ul>
          <li>read your songs, takes and coaching</li>
          <li>follow a take as you sing it</li>
          <li>control the Sing page while 📡 Remote is on</li>
        </ul>
        <div class="who mono" id="who"></div>
        <div class="to" id="to"></div>
        <div class="row">
          <button id="allow" class="primary" type="button">Allow</button>
          <button id="deny" type="button">Deny</button>
        </div>
      </section>

      <div id="msg" role="status"></div>
    </main>
    <script type="module" src="consent.js?v=74"></script>
  </body>
</html>
