<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1e" />
    <title>Resonate · Record</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%);
        color: #e8e8f0;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
      }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace; }
      header {
        padding: 1rem 1.25rem 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
      }
      .header-left { display: flex; align-items: baseline; gap: 0.75rem; }
      h1 { font-size: 1.25rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; opacity: 0.95; }
      .nav-link {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        padding: 0.2rem 0.6rem;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
      }
      .header-right { display: flex; align-items: baseline; gap: 0.6rem; }
      #version { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; color: #a64fff; opacity: 0.9; }
      #status { font-size: 0.75rem; opacity: 0.55; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.25rem 1rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        min-height: 0;
      }
      #live {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-shrink: 0;
      }
      #live-note {
        font-size: clamp(2.5rem, 12vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        min-width: 3.5ch;
        background: linear-gradient(135deg, #4f7cff, #a64fff, #ff4f9f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      #live-note[data-active="false"] {
        background: none;
        -webkit-text-fill-color: rgba(255,255,255,0.25);
        color: rgba(255,255,255,0.25);
      }
      .live-side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
      #live-cents { font-size: 0.9rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
      #timer { font-size: 1.1rem; font-variant-numeric: tabular-nums; opacity: 0.85; }
      #timer[data-rec="true"] { color: #ff6f8a; }
      #roll {
        width: 100%;
        flex: 1 1 auto;
        min-height: 180px;
        border-radius: 1rem;
        background: rgba(255,255,255,0.02);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        touch-action: pan-y;
        cursor: default;
      }
      #roll[data-pannable="true"] { cursor: grab; touch-action: none; }
      #transcript-wrap {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .transcript-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        color: rgba(255,255,255,0.45);
      }
      .transcript-tools { display: flex; gap: 0.4rem; }
      #note-count { font-size: 0.68rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.55); }
      .chip-btn {
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.2);
        background: transparent;
        color: rgba(255,255,255,0.8);
        cursor: pointer;
      }
      .chip-btn:disabled { opacity: 0.35; cursor: default; }
      #transcript {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        max-height: 22vh;
        overflow-y: auto;
        align-content: flex-start;
        min-height: 2.6rem;
        padding: 0.1rem 0;
      }
      #transcript:empty::before {
        content: attr(data-empty);
        font-size: 0.85rem;
        opacity: 0.4;
      }
      .note-chip {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding: 0.3rem 0.5rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: inherit;
        font: inherit;
        cursor: pointer;
        min-width: 3rem;
      }
      .note-chip b { font-size: 0.95rem; }
      .note-chip small { font-size: 0.62rem; opacity: 0.6; font-variant-numeric: tabular-nums; }
      .note-chip[data-tune="good"] { border-color: rgba(74,222,128,0.45); }
      .note-chip[data-tune="ok"]   { border-color: rgba(166,79,255,0.5); }
      .note-chip[data-tune="off"]  { border-color: rgba(255,111,111,0.5); }
      .note-chip[data-selected="true"] { background: rgba(166,79,255,0.22); }
      .score-chip { min-width: 2.9rem; padding: 0.25rem 0.4rem; }
      .score-chip i {
        font-family: system-ui, sans-serif;
        font-style: italic;
        font-weight: 600;
        font-size: 0.85rem;
        color: #ffe6a0;
        min-height: 1.1em;
        white-space: nowrap;
      }
      .score-chip b { font-size: 0.78rem; opacity: 0.85; }
      .note-chip[data-tune="pending"], .note-chip[data-tune="unsung"] { border-color: rgba(255,255,255,0.1); }
      .note-chip[data-tune="unsung"] { opacity: 0.45; }
      .note-chip[data-tune="missed"] { border-style: dashed; border-color: rgba(255,255,255,0.35); opacity: 0.75; }
      .phrase-break { flex-basis: 100%; height: 0; }
      #song-bar { display: flex; gap: 0.4rem; flex-shrink: 0; }
      #song-bar select {
        font: inherit;
        font-size: 0.8rem;
        color: #e8e8f0;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 0.5rem;
        padding: 0.35rem 0.3rem;
        min-width: 0;
        flex: 0 1 auto;
      }
      #song-select { flex: 1 1 0; }
      #song-bar select[hidden] { display: none; }
      #song-error { font-size: 0.8rem; color: #ff8a9a; }
      #song-error[hidden] { display: none; }
      .transcript-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
      #tabs { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; }
      #tabs[hidden] { display: none; }
      #tabs button {
        font: inherit;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        padding: 0.2rem 0.55rem;
        border: 0;
        background: transparent;
        color: rgba(255,255,255,0.6);
        cursor: pointer;
      }
      #tabs button[data-active="true"] { background: rgba(166,79,255,0.35); color: #fff; }
      footer {
        padding: 0.9rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
      }
      #rec {
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 1rem 2.5rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f7cff, #a64fff);
        color: white;
        cursor: pointer;
        min-width: 180px;
        box-shadow: 0 8px 24px -8px rgba(79,124,255,0.5);
        transition: transform 0.1s ease;
      }
      #rec:active { transform: scale(0.97); }
      #rec[data-recording="true"] {
        background: linear-gradient(135deg, #ff4f6f, #ff8a4f);
        box-shadow: 0 8px 24px -8px rgba(255,79,111,0.5);
      }
      #rec:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a class="nav-link" href="./">← Tuner</a>
        <h1>Record</h1>
      </div>
      <div class="header-right mono">
        <span id="version">v16</span>
        <span id="status">idle</span>
      </div>
    </header>
    <main>
      <section id="song-bar">
        <select id="song-select" aria-label="Song">
          <option value="">No song</option>
          <option value="amazing-grace">Amazing Grace</option>
          <option value="load">Load MusicXML…</option>
        </select>
        <select id="verse-select" aria-label="Verse" hidden></select>
        <select id="key-select" aria-label="Key" hidden>
          <option value="written">As written</option>
          <option value="any">Any key</option>
        </select>
        <input id="file-input" type="file" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" hidden />
      </section>
      <div id="song-error" hidden></div>
      <section id="live">
        <div id="live-note" data-active="false">—</div>
        <div class="live-side mono">
          <span id="timer">0:00.0</span>
          <span id="live-cents">—</span>
        </div>
      </section>
      <canvas id="roll"></canvas>
      <section id="transcript-wrap">
        <div class="transcript-head mono">
          <span class="transcript-left">
            <span id="tabs" hidden><button type="button" data-tab="score">Score</button><button type="button" data-tab="notes">Notes</button></span>
          </span>
          <span class="transcript-tools">
            <button id="accidentals" class="chip-btn" type="button">♯ / ♭</button>
            <button id="copy" class="chip-btn" type="button" disabled>Copy</button>
          </span>
        </div>
        <div id="note-count" class="mono">NOTES</div>
        <div id="transcript" data-empty="Hit Record and sing — notes will appear here."></div>
      </section>
    </main>
    <footer>
      <button id="rec" type="button">Record</button>
    </footer>
    <script type="module" src="record.js"></script>
  </body>
</html>
