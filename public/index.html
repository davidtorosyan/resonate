<!doctype html>
<html lang="en" data-shell>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d1c" />
    <meta name="color-scheme" content="dark" />
    <title>Resonate</title>
    <style>
      /* Resonate on one page — the shell, the site's root (v92; shell.html sends here). Tokens (REDESIGN §15), then the shell's own rules. */
      :root {
        color-scheme: dark;
        --bg: #0d0d1c; --bg-glow: #1c1a44; --sheet: #1a1a38; --sheet-2: #121228;
        --card: rgba(255,255,255,.035); --card-2: rgba(255,255,255,.055); --control: rgba(255,255,255,.07); --control-hi: rgba(255,255,255,.12);
        --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16); --well: rgba(4,4,14,.42);
        --text: #ecebf4; --text-2: rgba(236,235,244,.68); --text-3: rgba(236,235,244,.58);
        --accent: #a64fff; --accent-hi: #c48bff;
        --grad-primary: linear-gradient(135deg, #4f7cff, #a64fff);
        --grad-note: linear-gradient(100deg, #6f8dff 0%, #a64fff 55%, #ff5fa8 100%);
        --grad-live: linear-gradient(135deg, #ff4f6f, #ff8a4f);
        --good: #4ade80; --close: #c49bff; --aim: #f5a85a; --now: #ffe6a0;
        --ok: #8ee6a8; --warn: #ffd58a; --error: #ffb38a;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
        --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", Inter, system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        --r-card: 18px; --r-sheet: 24px; --gutter: 12px; --top-h: 52px;
        --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
        --shadow-pop: 0 24px 60px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.07);
        --shadow-sheet: 0 -16px 50px rgba(0,0,0,.55);
        --glow-primary: 0 10px 28px -10px rgba(110,100,255,.75);
        --dock-h: 108px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      body { background: var(--bg); color: var(--text); font: 15px/1.35 var(--font); -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      [hidden] { display: none !important; }
      svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      svg.i.fill { fill: currentColor; stroke: none; }
      .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .spacer { flex: 1; }

      /* --- the shell: one fixed viewport, four bands ------------------------------------------ */
      .app {
        position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; /* (no stacking context: the top bar sits above the scrim) */
        background: radial-gradient(120% 60% at 50% -8%, var(--bg-glow) 0%, rgba(28,26,68,0) 62%), radial-gradient(80% 50% at 100% 110%, rgba(79,124,255,.08), transparent 60%), var(--bg);
        padding: var(--sat) calc(var(--gutter) + env(safe-area-inset-right)) 0 calc(var(--gutter) + env(safe-area-inset-left));
      }
      .top { height: var(--top-h); flex: none; position: relative; z-index: 46; display: flex; align-items: center; gap: 8px; }
      .brand { display: flex; align-items: center; gap: 8px; height: 44px; min-width: 44px; flex: none; font: 700 17px/1 var(--display); letter-spacing: -.01em; }
      .brand .mark { width: 22px; height: 22px; transform-origin: 0 50%; transition: transform .3s cubic-bezier(.22,.8,.24,1); }
      .brand .bt { display: inline-block; overflow: hidden; white-space: nowrap; max-width: 5em; transition: max-width .3s cubic-bezier(.22,.8,.24,1), opacity .2s ease; }
      .app[data-song] .brand { gap: 0; }
      .app[data-song] .brand .bt { max-width: 0; opacity: 0; }
      .app[data-song] .brand .mark { transform: scale(.88); }
      .ver { font: 600 11px/1 var(--mono); color: var(--accent-hi); letter-spacing: .02em; }
      /* The AI button (assist.js remote: once an assistant has connected) while Sing isn't shown
         (with Sing, its own is in the top bar: the same switch); lit and pulsing while on */
      .hremote { position: relative; z-index: 60; flex: none; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--control);
        font: 600 14px/1 var(--font); color: var(--text); opacity: .75; white-space: nowrap; touch-action: manipulation; }
      .hremote .ai-mark { display: block; width: 22.5px; height: 18px; margin: 0 auto; }
      .hremote[data-on="true"] { opacity: 1; background: #a64fff; border-color: #c48bff; box-shadow: 0 0 0 3px rgba(166,79,255,.25); animation: hremote-pulse 2.4s ease-in-out infinite; }
      @keyframes hremote-pulse { 50% { box-shadow: 0 0 0 6px rgba(166,79,255,.12); } }
      @media (prefers-reduced-motion: reduce) { .hremote[data-on="true"] { animation: none; } }
      .app[data-sing] .hremote { display: none; }
      .avatar { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; z-index: 60; }
      .avatar .face { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--grad-primary); font: 700 15px/1 var(--display); color: #fff;
        box-shadow: 0 0 0 2px #0d0d1c, 0 0 0 3.5px rgba(166,79,255,.55); }
      .avatar[data-out] .face { background: var(--control); box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--text-2); }
      .avatar[data-out] .face svg { width: 20px; height: 20px; }
      .avatar[aria-expanded="true"] .face { box-shadow: 0 0 0 2px #0d0d1c, 0 0 0 3.5px var(--accent); }

      /* --- home: the full tuner + Next-up ------------------------------------------------------ */
      .home { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding-bottom: 6px; }
      .app:not([data-tin="home"]) .home { display: none; }
      .tuner { width: 100%; display: flex; flex-direction: column; align-items: center; flex: none; }
      .ribbon-wrap { display: block; width: min(100%, 340px); margin-bottom: 18px; }
      .ribbon-wrap .lbl { display: flex; justify-content: space-between; font: 600 11px/1 var(--font); color: var(--text-3); letter-spacing: .04em; margin-bottom: 7px; }
      .ribbon-wrap .lbl b { color: var(--text-2); font-weight: 650; letter-spacing: 0; }
      .ribbon-wrap .rb { position: relative; height: 26px; }
      .rb .trk { position: absolute; left: 0; right: 0; top: 2px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); }
      .rb .lim { position: absolute; top: 2px; height: 6px; border-radius: 3px; background: rgba(166,79,255,.25); }
      .rb .cmf { position: absolute; top: 1px; height: 8px; border-radius: 4px; background: linear-gradient(90deg,#6f8dff,#a64fff); box-shadow: 0 0 12px rgba(166,79,255,.45); }
      .rb .tk { position: absolute; top: 0; width: 1px; height: 10px; background: rgba(255,255,255,.18); }
      .rb .ol { position: absolute; top: 15px; transform: translateX(-50%); font: 600 9.5px/1 var(--mono); color: var(--text-3); }
      .rb .mk { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 10px 2px rgba(74,222,128,.8); }
      .gauge { width: min(100%, 340px); }
      .gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
      .note-text { font-family: var(--display); font-weight: 800; letter-spacing: -.04em; font-size: 124px; line-height: .9;
        background: var(--grad-note); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-flex; align-items: flex-start; min-height: .9em; }
      .note-text .acc { font-weight: 700; letter-spacing: 0; font-size: .58em; margin-left: .02em; margin-top: .06em; }
      .note-text .oct { font-weight: 700; font-size: .36em; margin-left: .06em; margin-top: .14em; letter-spacing: 0; opacity: .9; }
      .note-text[data-onnote="false"] { opacity: .55; }
      .tuner[data-mic="off"] .note-text, .tuner[data-mic="blocked"] .note-text, .tuner[data-mic="noanswer"] .note-text, .tuner[data-mic="error"] .note-text { opacity: .35; }
      .cents { font: 600 15px/1 var(--mono); color: var(--good); margin-top: 6px; letter-spacing: .02em; min-height: 15px; }
      .cents[data-tune="close"] { color: var(--close); }
      .cents[data-tune="aim"] { color: var(--aim); }
      .tmsg { font: 600 13px/1.3 var(--font); color: var(--warn); margin-top: 8px; text-align: center; max-width: 320px; }
      .tuner:not([data-mic="blocked"]):not([data-mic="error"]) .tmsg { color: var(--text-2); }
      .level { display: flex; align-items: center; gap: 10px; width: min(100%, 300px); margin-top: 18px; color: var(--text-3); }
      .level .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
      .level .bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: linear-gradient(90deg,#4f7cff,#a64fff 70%,#ff5fa8); }
      .level .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 1px; }
      .level .ticks b { width: 1.5px; background: rgba(13,13,28,.9); }
      .level .n { font: 600 12px/1 var(--mono); color: var(--text-2); width: 18px; text-align: right; }
      .level .cal { width: 44px; height: 44px; margin: -12px -10px -12px -6px; display: grid; place-items: center; border-radius: 9px; color: var(--text-3); }
      .level .cal svg { width: 17px; height: 17px; }
      .scope { width: calc(100% + 2 * var(--gutter)); margin: 14px calc(-1 * var(--gutter)) 0; height: 96px; flex: none; }
      .scope canvas { display: block; width: 100%; height: 100%; }
      /* Next-up: a one-line chip just above Songs */
      .nextup { align-self: flex-end; height: 44px; max-width: min(100%, 320px); display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 6px; border-radius: 22px;
        background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); font: 650 14px/1 var(--font); color: var(--text-2); flex: none; }
      .nextup .go { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--grad-primary); color: #fff; flex: none; }
      .nextup .go svg { width: 12px; height: 12px; margin-left: 2px; }
      .nextup .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* --- the dock ---------------------------------------------------------------------------- */
      .dock { flex: none; padding: 8px 0 calc(8px + var(--sab)); display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 20; }
      /* (the corner — Songs and the module toggles — sits at the row's bottom right in every state: the row's
         height may change, its bottom edge doesn't) */
      .dock .row { display: flex; align-items: flex-end; gap: 10px; min-height: 70px; }
      .app[data-form="full"] .dock .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
      .dock .row > .rec { justify-self: start; grid-column: 1; }
      .dock .row > .main { grid-column: 2; }
      .dock .row > .corner { justify-self: end; grid-column: 3; margin-left: auto; }
      .round { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; flex: none; }
      .round .bw { position: relative; }
      .round .b { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--control); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); }
      .round .b svg { width: 22px; height: 22px; }
      .round .l { font: 600 11px/1 var(--font); color: var(--text-3); white-space: nowrap; }
      .round.rec .b { color: #ff6b7d; }
      .round.rec .b svg { width: 18px; height: 18px; }
      .round.main { width: 96px; }
      .round.main .b { width: 74px; height: 74px; background: var(--grad-primary); color: #fff; box-shadow: var(--glow-primary), 0 0 0 6px rgba(166,79,255,.12); }
      .round.main .b svg { width: 28px; height: 28px; }
      .round.main .l { color: var(--text-2); }
      .round.main .sq { width: 20px; height: 20px; border-radius: 4px; background: #fff; }
      .round.main[data-mic="listening"] .b { box-shadow: var(--glow-primary), 0 0 0 6px rgba(166,79,255,.28), 0 0 26px 4px rgba(166,79,255,.45); }
      .round.main[data-mic="blocked"] .b, .round.main[data-mic="noanswer"] .b, .round.main[data-mic="error"] .b { background: var(--control); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text-2); }
      .round.songs .b { background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.05)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 8px 22px -10px rgba(0,0,0,.7); }
      body[data-done] .round.songs .b { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 0 0 3px rgba(74,222,128,.75); }
      .corner { display: flex; align-items: flex-start; gap: 8px; flex: none; }
      .corner > .imptile { margin-top: 3px; }
      /* the module toggles: Sing · Score (a song open) · Piano — beside Songs */
      .mods { display: flex; gap: 2px; height: 54px; border-radius: 17px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
      .mod { width: 44px; height: 54px; border-radius: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-3); font: 650 10.5px/1 var(--font); }
      .mod svg { width: 20px; height: 20px; }
      .mod[aria-pressed="true"] { background: rgba(166,79,255,.24); color: var(--text); box-shadow: inset 0 0 0 1.5px rgba(166,79,255,.7); }
      .mod:disabled { opacity: .4; cursor: default; }

      /* the folded import: a tile beside Songs (a pill on a wide screen), and the done row */
      .imptile { position: relative; width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
        background: linear-gradient(180deg,#24244c,#1b1b3a); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); text-align: left; }
      .imptile .ringw { position: relative; width: 38px; height: 38px; flex: none; }
      .imptile .ringw svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .imptile .ringw .arc { transition: stroke-dasharray .6s ease; }
      .imptile .ringw .arc.spin { stroke-dasharray: 22 107 !important; transform-origin: 20px 20px; animation: shspin 1.2s linear infinite; }
      @keyframes shspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .imptile .ringw .arc.spin { animation: none; } }
      .imptile .g { position: absolute; inset: 0; display: grid; place-items: center; font: 700 13px/1 var(--mono); color: var(--now); }
      .imptile[data-phase="error"] .g, .imptile[data-phase="stuck"] .g { color: var(--warn); }
      .imptile .n { position: absolute; right: -4px; bottom: -4px; height: 17px; padding: 0 5px; border-radius: 9px; background: #2b2b58; box-shadow: 0 0 0 2px var(--bg); font: 700 10px/17px var(--mono); color: var(--now); }
      .imptile .pw { display: none; }
      .capsule { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 6px 0 9px; border-radius: 20px;
        background: linear-gradient(180deg,#24244c,#1b1b3a); box-shadow: 0 16px 36px -12px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); }
      .capsule .okring { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(74,222,128,.16); box-shadow: inset 0 0 0 2.5px var(--good); color: var(--good); }
      .capsule .okring svg { width: 20px; height: 20px; stroke-width: 2.6; }
      .capsule .ct { flex: 1; min-width: 0; }
      .capsule .t { font: 650 14px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .capsule .s { font: 600 11.5px/1.2 var(--mono); color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .capsule .s b { color: var(--good); font-weight: 600; }
      .openbtn { height: 44px; padding: 0 18px; border-radius: 12px; background: var(--grad-primary); color: #fff; font: 700 14px/1 var(--font); box-shadow: var(--glow-primary); flex: none; }
      .capsule .x { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-3); flex: none; }

      /* --- overlays: scrim, sheets, popovers ------------------------------------------------------ */
      .scrim { position: fixed; inset: 0; background: rgba(5,5,14,.55); z-index: 40; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex; flex-direction: column; overflow: hidden;
        background: linear-gradient(180deg, var(--sheet), var(--sheet-2)); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
        box-shadow: var(--shadow-sheet), inset 0 1px 0 rgba(255,255,255,.08); padding-bottom: var(--sab); }
      .grab { position: relative; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin: 8px auto 2px; flex: none; touch-action: none; }
      /* (dragged down, it closes the sheet — chrome.js; the 40×5 bar alone is a sliver for a finger) */
      .grab::before { content: ""; position: absolute; left: -70px; right: -70px; top: -8px; bottom: -6px; }
      /* (the head drags it too: no browser pan to cancel it, no text selected — dragging a selection is the browser's own drag) */
      .sheet.songs .sheet-head, .sheet.acct .acct-head, .grab { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; flex: none; }
      .sheet-head h2 { margin: 0; font: 800 24px/1 var(--display); letter-spacing: -.02em; }
      .addbtn { height: 44px; padding: 0 15px 0 12px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; background: var(--grad-primary); color: #fff; font: 700 14px/1 var(--font); box-shadow: var(--glow-primary); }
      .addbtn svg { width: 17px; height: 17px; stroke-width: 2.4; }
      .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
      .sec { font: 700 12px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 14px 2px 8px; display: flex; align-items: center; justify-content: space-between; }
      .sec span { text-transform: none; letter-spacing: 0; font-weight: 600; }
      .sec .sh { text-transform: inherit; letter-spacing: inherit; font-weight: inherit; }
      .sec .sh .mono { text-transform: none; letter-spacing: 0; font-weight: 600; }
      .sec { flex-wrap: wrap; gap: 6px; }
      .sec .sacts { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
      .sec .qstat { font: 600 12px/1 var(--mono); color: var(--now); }
      .secbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--control); box-shadow: inset 0 0 0 1px var(--line-2); font: 650 12.5px/1 var(--font); color: var(--text); white-space: nowrap; }
      .rows { border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
      .song { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 9px 12px; position: relative; text-align: left; }
      .rows > * + * { box-shadow: inset 0 1px 0 var(--line); }
      /* a row: the song (tap: open it) + its ⋯ (Convert / Reconvert, Delete) */
      .songrow { display: flex; align-items: stretch; }
      .songrow .song { flex: 1; min-width: 0; }
      .songrow .more { width: 48px; flex: none; display: grid; place-items: center; color: var(--text-3); }
      .songrow .more[aria-expanded="true"] { color: var(--text); background: var(--control); }
      .song .tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; position: relative; }
      .song .tile svg.i { width: 19px; height: 19px; }
      .song .tile > svg:not(.i) { position: absolute; inset: 0; width: 40px; height: 40px; }
      .tile[data-src="pdf"] { background: rgba(255,79,159,.14); color: #ff8ec2; }
      .tile[data-src="xml"], .tile[data-src="conv"] { background: rgba(79,124,255,.16); color: #9db4ff; }
      .tile[data-src="sample"] { background: rgba(166,79,255,.16); color: var(--accent-hi); }
      .tile[data-src="reading"] { background: rgba(255,230,160,.08); color: var(--now); }
      .song .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .song .t { font: 650 15px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .song .s { font: 500 12px/1.2 var(--mono); color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* the fact line: what the song is · how old — and, read by an older engine than this one, a quiet "v9 → v10" */
      .song .sl { display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 3px; }
      .song .sl .s { margin-top: 0; min-width: 0; }
      .song .eng { flex: none; padding: 2px 6px; border-radius: 6px; font: 600 10.5px/1.2 var(--mono); color: rgba(255,213,138,.85); background: rgba(255,213,138,.08); box-shadow: inset 0 0 0 1px rgba(255,213,138,.22); white-space: nowrap; }
      .song .s b { color: var(--now); font-weight: 600; }
      .song .chev { width: 18px; height: 18px; color: var(--text-3); }
      .song[data-current]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
      .msg { margin: 0 16px 6px; font: 600 13px/1.35 var(--font); color: var(--text-2); }
      .msg[data-kind="error"] { color: var(--error); }
      .msg[data-kind="ok"] { color: var(--ok); }
      .linkrow { display: flex; gap: 8px; margin: 0 16px 8px; flex: none; }

      /* --- a song open: its title · ✕, the tuner's small forms, the modules (songview.js) ------------------ */

      /* docked (tablet, desktop): the note · word, cents bar, cents + level · mic; a faint waveform edge */
      .tuner[data-form="docked"] { height: 150px; border-radius: 22px; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto auto 1fr;
        column-gap: 24px; row-gap: 4px; align-items: center; padding: 14px 22px 0; overflow: hidden; }

      .app[data-song] #rec-btn, .app:not([data-form="full"]) #main-btn, .app:not([data-sing]) #listen-w, .app:not([data-sing]) .dock #sing { display: none; }
      #listen { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--control); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 0; color: var(--text); }
      #listen::before { content: "\25B6\FE0E"; font-size: 19px; line-height: 1; margin-left: 3px; }

      .dock #sing { flex: 1 1 auto; align-self: flex-start; min-width: 0; max-width: 340px; height: 58px; margin: -2px auto 0; padding: 0 16px; border-radius: 20px; background: var(--grad-primary); color: #fff;
        font: 700 17px/1.1 var(--display); box-shadow: var(--glow-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dock #sing[data-active="true"] { background: var(--grad-live); box-shadow: 0 10px 28px -10px rgba(255,79,111,.7); }
      .dock #sing:disabled { opacity: .45; cursor: default; }

      @media (max-width: 499px) {

      }
      @media (min-width: 700px) {

        #listen { width: 58px; height: 58px; }
      }
      /* --- the modules: Sing, the Score (shell/scoreview.js: play.html mounted), the Piano ---------------- */

      @media (max-width: 699px) {
        .app[data-sing][data-score] .sing-root { flex: 1 1 0; height: auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
        .app[data-sing][data-score] .score-root { flex: 1.15 1 0; }

      /* the Piano on its own (no Score shown): above the dock, full-bleed */
      .pianobar { flex: none; display: flex; margin: 8px calc(-1 * var(--gutter) - env(safe-area-inset-right)) 0 calc(-1 * var(--gutter) - env(safe-area-inset-left));
        padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left)); background: #14142c; position: relative; z-index: 1; }
      .pianobar .kb { flex: 1 1 auto; min-width: 0; height: clamp(56px, 9vh, 110px); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
      .pianobar .kb svg { display: block; width: 100%; height: 100%; }
      /* the drawn hand (E7): a band under the keys for the palm, the wrist and the forearm (hand.js draws there; the keys keep their height) */
      .pianobar[data-hand] { padding-bottom: calc(6px + var(--kb-band, 0px)); }
      /* the fingering's button (E7): the row's right end, 44 × 44 — off: a hand's outline, numbers: 123, hand: the hand filled */
      .pianobar .fing { flex: none; align-self: center; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line-2);
        background: var(--control); color: var(--text-2); font: 700 13px/1 var(--font); touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
      .pianobar .fing[hidden] { display: none; }
      .pianobar .fing:not([data-mode="off"]) { color: var(--text); background: rgba(166,79,255,0.28); border-color: #a64fff; }
      .pianobar .fing .n { letter-spacing: -.02em; }
      /* the tuner in the top bar (Sing and the Score, ≥ 700 px): a strip that gives way to the song pill */
      .top > .tuner[data-form="strip"] { width: auto; flex: 1 1 260px; min-width: 200px; max-width: 460px; }
      .top > .tuner[data-form="strip"] .tword { display: none !important; }
      .app[data-tin="top"] .songpill { min-width: 60px; }
      /* the mic chip (the Score alone): its button and the note it last heard */
      .tuner[data-form="chip"] { flex-direction: row; align-items: center; gap: 2px; width: auto; height: 44px; cursor: pointer; flex: none; background: none; }
      .tuner[data-form="chip"] > :not(.tmic):not(.note-text) { display: none !important; }
      .tuner[data-form="chip"] .tmic { display: flex; }
      .tuner[data-form="chip"] .note-text { font-size: 22px; min-width: 1.7em; opacity: .8; justify-content: center; }
      .tuner[data-form="chip"][data-hold="take"] .tmic .b { background: var(--grad-live); }
      @media (max-width: 479px) {
        .app .score-root #bar, .app .score-root #bar .ctl { column-gap: 4px; }
        .tuner[data-form="chip"] .note-text { display: none; }
      }
      /* the Score alone: its ▶ Play in the dock */
      .dock #play { flex: 1 1 auto; align-self: flex-start; min-width: 0; max-width: 340px; height: 58px; margin: -2px auto 0; padding: 0 18px; border-radius: 20px; background: var(--grad-primary); color: #fff;
        display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 17px/1 var(--display); box-shadow: var(--glow-primary); border: 0; }
      .dock #play svg { width: 18px; height: 18px; }
      .dock #play::after { content: "Play"; }
      .dock #play[data-icon="stop"] { background: var(--grad-live); box-shadow: 0 10px 28px -10px rgba(255,79,111,.7); }
      .dock #play[data-icon="stop"]::after { content: "Stop"; }
      .dock #play:disabled { opacity: .45; cursor: default; }
      @media (prefers-reduced-motion: reduce) {
        .brand .bt, .brand .mark { transition: opacity .15s ease; }
        .songpill[data-loading] .t { animation: none; opacity: .6; }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app" data-form="full" data-tin="home">
      <header class="top">
        <a class="brand" id="brand" href="./" aria-label="Resonate — home"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f8dff"/><stop offset=".55" stop-color="#a64fff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><circle cx="12" cy="12" r="9.5" fill="none" stroke="url(#lg)" stroke-width="2.4"/><path d="M6.5 12.5c1.2 0 1.4-4 2.8-4s1.4 7 2.8 7 1.4-5 2.7-5 1 2 2.7 2" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg><span class="bt">Resonate</span></a>
        <span class="songpill" id="song-pill" hidden><span class="pt" id="song-title"><span class="t"></span></span><button class="px" id="song-close" type="button" aria-label="Close the song" title="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
        <span class="spacer"></span>
        <span class="sing-scope sing-top" id="sing-top" hidden></span>
        <button class="hremote" id="home-remote" type="button" aria-pressed="false" aria-label="Let an assistant control this device" title="Let an assistant control this device" hidden><svg class="ai-mark" viewBox="0 0 20 16" aria-hidden="true" focusable="false"><path d="M1.5 14.5 6.5 1.5l5 13M3.25 10h6.5M13.5 1.5h5M16 1.5v13M13.5 14.5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span id="version" class="ver mono">v112</span>
        <button class="avatar" id="avatar" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Account"></button>
      </header>
      <main class="home">
        <section class="tuner" id="tuner" aria-label="Tuner"></section>
      </main>
      <div class="stack" id="stack">
        <section class="sing-root sing-scope" id="sing-region" aria-label="Sing" hidden></section>
        <section class="score-root play-scope" id="score-region" aria-label="Score" hidden></section>
      </div>
      <section class="pianobar" id="piano-region" aria-label="Piano" hidden><div class="kb"></div></section>
      <footer class="dock">
        <div class="capsule" id="imp-done" role="status" hidden>
          <span class="okring"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="ct"><span class="t" style="display:block"></span><span class="s" style="display:block"></span></span>
          <button class="openbtn" type="button">Open</button>
          <button class="x" type="button" aria-label="Dismiss"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <button class="nextup" id="nextup" type="button" hidden></button>
        <div class="row">
          <a class="round rec" id="rec-btn" href="./?open=record"><span class="bw"><span class="b"></span></span><span class="l">Record</span></a>
          <button class="round main" id="main-btn" type="button" data-mic="off"><span class="bw"><span class="b"></span></span><span class="l">Start</span></button>
          <span class="corner">
            <button class="imptile" id="imp-mini" type="button" hidden>
              <span class="ringw"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="imp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/><circle class="arc" cx="20" cy="20" r="17" fill="none" stroke="url(#imp-g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 107"/></svg><span class="g">·</span></span>
              <span class="n mono"></span>
              <span class="pw"><span class="pt"></span><span class="ps"></span></span>
            </button>
            <span class="mods" id="mods" role="group" aria-label="Show">
              <button class="mod" id="mod-sing" type="button" aria-pressed="false" title="Sing" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2.5l2-5 3 10 3-13 3 13 2-5H21"/></svg><span>Sing</span></button>
              <button class="mod" id="mod-score" type="button" aria-pressed="false" title="Score" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 11h18M3 15h18"/><ellipse cx="9" cy="15.2" rx="2.7" ry="2" transform="rotate(-22 9 15.2)" fill="currentColor"/><path d="M11.4 14.2V3.8l4 1.4"/></svg><span>Score</span></button>
              <button class="mod" id="mod-piano" type="button" aria-pressed="false" title="Piano"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M9 14v5M15 14v5"/><rect x="7.4" y="5" width="3.2" height="9" rx=".6" fill="currentColor" stroke="none"/><rect x="13.4" y="5" width="3.2" height="9" rx=".6" fill="currentColor" stroke="none"/></svg><span>Piano</span></button>
            </span>
            <button class="round songs" id="songs-btn" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="bw"><span class="b"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M4 11h9M4 16h5"/><path d="M18 4.5v11"/><circle cx="15.6" cy="16.2" r="2.4"/><path d="M18 4.5c1.2.4 2.3 1.1 2.6 2.6"/></svg></span></span><span class="l">Songs</span></button>
          </span>
        </div>
      </footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <section class="sheet songs" id="songs" role="dialog" aria-label="Songs" hidden>
      <div class="grab"></div>
      <div class="sheet-head"><h2>Songs</h2><span class="spacer"></span>
        <button class="addbtn" id="add-btn" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
      <form class="linkrow" id="link-form" hidden>
        <input id="link-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="MusicXML link" aria-label="MusicXML link" />
        <button type="submit">Open</button>
      </form>
      <div class="pop addmenu" id="add-menu" role="menu" aria-label="Add a song" hidden>
        <button class="prow" id="add-pdf" type="button" role="menuitem"><span class="lead l-pdf"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/></svg></span><span class="pl">PDF</span></button>
        <button class="prow" id="add-xml" type="button" role="menuitem"><span class="lead l-xml"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5M10 12.5l-2 2.2 2 2.2M14 12.5l2 2.2-2 2.2"/></svg></span><span class="pl">MusicXML<small>.musicxml · .mxl</small></span></button>
        <button class="prow" id="add-link" type="button" role="menuitem"><span class="lead l-plain"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span class="pl">Link</span></button>
      </div>
      <div class="pop rowmenu" id="row-menu" role="menu" aria-label="Song options" hidden></div>
      <p class="msg" id="songs-msg" role="status" hidden></p>
      <div class="sheet-body" id="songs-body"></div>
    </section>

    <section class="sheet acct" id="acct" role="dialog" aria-label="Account" hidden></section>

    <section class="sheet tray" id="tray" role="dialog" aria-label="Reading a PDF" hidden>
      <div id="reader-host"></div>
      <div class="traybar" id="tray-bar" hidden><span id="tray-msg"></span><span class="btns"></span></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
    <input id="xml-input" type="file" hidden />
    <input id="pdf-input" type="file" accept=".pdf,application/pdf" multiple hidden />
    <div id="places"></div><!-- Record, Voice, Assistants in place (shell/places.js) -->

    <script type="module" src="nav.js?v=112"></script>
    <script type="module" src="shell/boot.js?v=112"></script>
  </body>
</html>
