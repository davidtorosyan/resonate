<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1e" />
    <title>Resonate · Tools</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%) fixed;
        color: #e8e8f0;
        padding-top: env(safe-area-inset-top);
      }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace; }
      header { padding: 0.9rem 1.25rem 0.5rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
      .header-left { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
      h1 { font-size: 1.25rem; margin: 0 0.25rem 0 0; font-weight: 600; letter-spacing: 0.02em; opacity: 0.95; }
      .nav-link { font-size: 0.8rem; color: rgba(255,255,255,0.6); text-decoration: none; padding: 0.2rem 0.6rem; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; }
      #version { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; color: #a64fff; opacity: 0.9; }
      main { max-width: 640px; margin: 0 auto; padding: 0.5rem 1rem calc(2rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 0.8rem; }
      .tool {
        display: block;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 1rem;
        padding: 1rem 1.1rem;
      }
      a.tool:active { transform: scale(0.99); }
      .tool h2 { margin: 0 0 0.3rem; font-size: 1.02rem; display: flex; align-items: center; gap: 0.5rem; }
      .tool p { margin: 0; font-size: 0.88rem; line-height: 1.45; opacity: 0.75; }
      .tag { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; padding: 0.12rem 0.45rem; border-radius: 999px; background: rgba(255,200,90,0.18); color: #ffd58a; }
      .note { font-size: 0.78rem; opacity: 0.5; text-align: center; }
      #checks { margin: 0.6rem 0 0; padding: 0; list-style: none; font-size: 0.8rem; line-height: 1.7; }
      #checks b { display: inline-block; width: 1.3em; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Tools</h1>
        <a class="nav-link" href="./">Tuner</a>
        <a class="nav-link" href="record.html">Record</a>
        <a class="nav-link" href="sing.html">Sing</a>
      </div>
      <span id="version" class="mono">v67</span>
    </header>
    <main>
      <a class="tool" href="pdf-import.html">
        <h2>PDF → Song <span class="tag">HEAVY</span></h2>
        <p>Sheet music → a song to sing. Audiveris, in your browser · ~60 MB once · ~½–1 min per page.</p>
      </a>
      <a class="tool" href="audiotest.html">
        <h2>Audio test</h2>
        <p>One note, seven ways to play it — for outputs that crackle (CarPlay, Bluetooth).</p>
      </a>
      <section class="tool">
        <h2>Device check</h2>
        <ul id="checks" class="mono"></ul>
      </section>
    </main>
    <script type="module">
      const checks = document.getElementById("checks");
      const row = (ok, label, extra = "") => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${ok ? "✓" : "✗"}</b>`;
        li.append(label + (extra ? ` — ${extra}` : ""));
        li.style.color = ok ? "" : "#ff8a9a";
        checks.appendChild(li);
      };
      const simd = (() => { try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11])); } catch { return false; } })();
      row(typeof WebAssembly === "object", "WebAssembly");
      row(simd, "WebAssembly SIMD", simd ? "fast OCR" : "slower OCR");
      row(typeof OffscreenCanvas === "function", "OffscreenCanvas", "PDF pages");
      row(typeof DecompressionStream === "function", "DecompressionStream", "gzip/zip support");
      row(!!window.indexedDB, "IndexedDB", "My songs + engine cache");
      row(!!navigator.mediaDevices?.getUserMedia, "Microphone API", window.isSecureContext ? "" : "needs HTTPS");
      row("wakeLock" in navigator, "Screen wake lock", "long jobs");
      row(true, `${navigator.hardwareConcurrency || "?"} CPU threads`);
      if (navigator.storage?.estimate) {
        navigator.storage.estimate().then(({ usage, quota }) => row(true, "Storage", `${(usage / 1e6).toFixed(0)} MB / ${(quota / 1e9).toFixed(1)} GB`));
      }
      if (performance.memory) row(true, "JS heap limit", `${Math.round(performance.memory.jsHeapSizeLimit / 1e6)} MB`);
    </script>
  </body>
</html>
